name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── geofence ─────────────────────────────────────────
      - name: Install (geofence)
        working-directory: geofence
        run: npm ci

      - name: Build (geofence)
        working-directory: geofence
        run: npm run build

      # ── renie-create-order ───────────────────────────────
      - name: Install (renie-create-order)
        working-directory: renie-create-order
        run: npm install

      - name: Build (renie-create-order)
        working-directory: renie-create-order
        run: npm run build

      # ── Assemble publish folder ──────────────────────────
      - name: Assemble publish folder
        run: |
          mkdir -p _site/geofence
          cp -r geofence/dist/. _site/geofence/

          mkdir -p _site/renie-create-order
          cp -r renie-create-order/dist/. _site/renie-create-order/

          # order-status-lock 為本機預建靜態檔，直接複製（無 build step）
          if [ -d order-status-lock ]; then
            mkdir -p _site/order-status-lock
            cp -r order-status-lock/. _site/order-status-lock/
          fi

          # checklist-signoff 為本機預建靜態檔，直接複製（無 build step）
          if [ -d checklist-signoff ]; then
            mkdir -p _site/checklist-signoff
            cp -r checklist-signoff/. _site/checklist-signoff/
          fi

          # pricing-settings 為本機預建靜態檔，直接複製（無 build step）
          if [ -d pricing-settings ]; then
            mkdir -p _site/pricing-settings
            cp -r pricing-settings/. _site/pricing-settings/
          fi

          # qiaoli-transport-tabs 為本機預建靜態檔，直接複製（無 build step —— 它吃本機 codebase alias）
          if [ -d qiaoli-transport-tabs ]; then
            mkdir -p _site/qiaoli-transport-tabs
            cp -r qiaoli-transport-tabs/. _site/qiaoli-transport-tabs/
          fi

          # Preserve existing root-level prototypes
          [ -f c-tooltip-style.html ] && cp c-tooltip-style.html _site/ || true
          [ -f order-management-drawer.html ] && cp order-management-drawer.html _site/ || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
